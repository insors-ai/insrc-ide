<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--vscode-font-family, system-ui, sans-serif);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-editor-foreground);
      background: var(--vscode-editor-background);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--vscode-panel-border, #333);
      flex-shrink: 0;
    }
    .header h1 { font-size: 1.2em; }
    .round-badge {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.78em;
      font-weight: 600;
    }
    .round-diverge { background: #2196f3; color: #fff; }
    .round-converge { background: #9c27b0; color: #fff; }
    .round-promote { background: var(--vscode-testing-iconPassed, #4caf7d); color: #fff; }
    .header-spacer { flex: 1; }
    .header-stat { font-size: 0.82em; color: var(--vscode-descriptionForeground); }
    .header-stat strong { color: var(--vscode-foreground); }

    /* Main layout: ideas (left) + spec (right) */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Ideas panel */
    .ideas-panel {
      flex: 2;
      overflow-y: auto;
      padding: 12px;
      border-right: 1px solid var(--vscode-panel-border, #333);
    }

    /* Theme group */
    .theme-group { margin-bottom: 16px; }
    .theme-header {
      font-weight: 600;
      font-size: 0.9em;
      padding: 4px 8px;
      margin-bottom: 6px;
      border-left: 3px solid var(--vscode-focusBorder, #007acc);
      color: var(--vscode-foreground);
    }
    .theme-header.ungrouped { border-left-color: var(--vscode-descriptionForeground, #888); }

    /* Idea card */
    .idea-card {
      background: var(--vscode-editorWidget-background, rgba(255,255,255,0.03));
      border: 1px solid var(--vscode-panel-border, #333);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 6px;
      transition: border-color 0.2s;
    }
    .idea-card:hover { border-color: var(--vscode-focusBorder, #007acc); }
    .idea-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .idea-title { font-weight: 500; font-size: 0.92em; flex: 1; }
    .idea-status {
      font-size: 0.72em;
      padding: 1px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .st-proposed { background: var(--vscode-badge-background); color: var(--vscode-badge-foreground); }
    .st-accepted { background: var(--vscode-testing-iconPassed, #4caf7d); color: #fff; }
    .st-rejected { background: var(--vscode-errorForeground, #f44); color: #fff; }
    .st-parked { background: var(--vscode-editorWarning-foreground, #cca700); color: #000; }
    .st-promoted { background: #2196f3; color: #fff; }
    .st-merged { background: #9c27b0; color: #fff; }
    .idea-desc {
      font-size: 0.85em;
      color: var(--vscode-descriptionForeground);
      line-height: 1.5;
    }

    /* Spec panel */
    .spec-panel {
      flex: 1;
      min-width: 250px;
      overflow-y: auto;
      padding: 12px;
      background: var(--vscode-editorWidget-background, rgba(255,255,255,0.02));
    }
    .spec-title {
      font-weight: 600;
      font-size: 0.95em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .spec-content {
      font-size: 0.88em;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .spec-content h1, .spec-content h2, .spec-content h3 { margin: 0.8em 0 0.3em; }
    .spec-content h1 { font-size: 1.2em; }
    .spec-content h2 { font-size: 1.05em; border-bottom: 1px solid var(--vscode-panel-border, #333); padding-bottom: 3px; }
    .spec-content ul { padding-left: 1.2em; }
    .spec-content code {
      font-family: var(--vscode-editor-font-family, monospace);
      background: var(--vscode-textCodeBlock-background, rgba(0,0,0,0.2));
      padding: 1px 3px;
      border-radius: 3px;
      font-size: 0.9em;
    }
    .spec-empty {
      color: var(--vscode-descriptionForeground);
      text-align: center;
      padding: 30px 10px;
      font-size: 0.88em;
    }

    /* Gate bar */
    .gate-bar {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--vscode-panel-border, #333);
      flex-shrink: 0;
      align-items: center;
    }
    .gate-label { font-size: 0.88em; color: var(--vscode-descriptionForeground); flex: 1; }
    .gate-btn {
      padding: 4px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85em;
      border: none;
    }
    .gate-btn-primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
    .gate-btn-primary:hover { background: var(--vscode-button-hoverBackground); }
    .gate-btn-secondary { background: transparent; color: var(--vscode-foreground); border: 1px solid var(--vscode-panel-border, #555); }
    .gate-btn-secondary:hover { opacity: 0.85; }

    .empty-state {
      color: var(--vscode-descriptionForeground);
      text-align: center;
      padding: 60px 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Brainstorm</h1>
    <span class="round-badge round-diverge" id="roundBadge" style="display:none">Round 1 — diverge</span>
    <span class="header-spacer"></span>
    <span class="header-stat" id="ideaCount"></span>
  </div>

  <div class="main">
    <div class="ideas-panel" id="ideasPanel">
      <div class="empty-state" id="emptyState">
        Run a <code>/brainstorm</code> command in the chat to start.
      </div>
    </div>
    <div class="spec-panel" id="specPanel">
      <div class="spec-title">Requirements Spec</div>
      <div class="spec-content" id="specContent">
        <div class="spec-empty">Spec builds as ideas are promoted.</div>
      </div>
    </div>
  </div>

  <div class="gate-bar" id="gateBar" style="display:none">
    <span class="gate-label" id="gateLabel">Action required</span>
  </div>

  <script>
    // @ts-ignore
    const vscode = acquireVsCodeApi();

    const ideasPanel = document.getElementById('ideasPanel');
    const specContent = document.getElementById('specContent');
    const roundBadge = document.getElementById('roundBadge');
    const ideaCountEl = document.getElementById('ideaCount');
    const gateBar = document.getElementById('gateBar');
    const emptyState = document.getElementById('emptyState');

    let ideas = [];
    let themes = [];

    window.addEventListener('message', (event) => {
      const msg = event.data;
      switch (msg.type) {
        case 'setRound':
          roundBadge.style.display = '';
          roundBadge.textContent = `Round ${msg.round} — ${msg.mode}`;
          roundBadge.className = `round-badge round-${msg.mode}`;
          break;

        case 'setIdeas':
          ideas = msg.ideas;
          themes = msg.themes || [];
          renderIdeas();
          break;

        case 'updateIdea': {
          const idea = ideas.find(i => i.id === msg.id);
          if (idea) {
            Object.assign(idea, msg.updates);
            renderIdeas();
          }
          break;
        }

        case 'addIdea':
          ideas.push(msg.idea);
          renderIdeas();
          break;

        case 'setThemes':
          themes = msg.themes;
          renderIdeas();
          break;

        case 'setSpec':
          specContent.innerHTML = formatSpec(msg.content);
          break;

        case 'appendSpec':
          specContent.innerHTML += formatSpec(msg.content);
          break;

        case 'showGate':
          showGate(msg.gateId, msg.label, msg.actions);
          break;

        case 'hideGate':
          gateBar.style.display = 'none';
          break;
      }
    });

    function renderIdeas() {
      emptyState.style.display = 'none';
      let html = '';

      if (themes.length > 0) {
        // Group by theme
        for (const theme of themes) {
          const themeIdeas = ideas.filter(i => i.theme === theme.id);
          if (themeIdeas.length === 0) continue;
          html += `<div class="theme-group">
            <div class="theme-header">${theme.name} (${themeIdeas.length})</div>
            ${themeIdeas.map(renderIdeaCard).join('')}
          </div>`;
        }
        // Ungrouped
        const ungrouped = ideas.filter(i => !i.theme);
        if (ungrouped.length > 0) {
          html += `<div class="theme-group">
            <div class="theme-header ungrouped">Ungrouped (${ungrouped.length})</div>
            ${ungrouped.map(renderIdeaCard).join('')}
          </div>`;
        }
      } else {
        // No themes yet — flat list
        html = ideas.map(renderIdeaCard).join('');
      }

      ideasPanel.innerHTML = html;

      // Update count
      const accepted = ideas.filter(i => i.status === 'accepted' || i.status === 'promoted').length;
      ideaCountEl.innerHTML = `<strong>${ideas.length}</strong> ideas, <strong>${accepted}</strong> accepted`;
    }

    function renderIdeaCard(idea) {
      return `<div class="idea-card">
        <div class="idea-top">
          <span class="idea-title">${idea.title || idea.id}</span>
          <span class="idea-status st-${idea.status || 'proposed'}">${idea.status || 'proposed'}</span>
        </div>
        ${idea.description ? `<div class="idea-desc">${idea.description}</div>` : ''}
      </div>`;
    }

    function formatSpec(content) {
      return content
        .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^[*-] (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
        .replace(/\n\n/g, '<br><br>');
    }

    function showGate(gateId, label, actions) {
      gateBar.style.display = 'flex';
      gateBar.innerHTML = `<span class="gate-label">${label || 'Action required'}</span>`;
      const acts = actions || [
        { name: 'continue', label: 'Continue' },
        { name: 'more', label: 'More Ideas' },
        { name: 'done', label: 'Done' },
      ];
      acts.forEach((a, i) => {
        const btn = document.createElement('button');
        btn.className = `gate-btn ${i === 0 ? 'gate-btn-primary' : 'gate-btn-secondary'}`;
        btn.textContent = a.label || a.name;
        btn.addEventListener('click', () => {
          vscode.postMessage({ type: 'gateReply', gateId, action: a.name });
          gateBar.style.display = 'none';
        });
        gateBar.appendChild(btn);
      });
    }
  </script>
</body>
</html>
