                item.tags.forEach(t => {
                  const tag = document.createElement('span');
                  tag.className = 'gate-item-tag';
                  tag.textContent = t;
                  tagsDiv.appendChild(tag);
                });
                body.appendChild(tagsDiv);
              }
              // Per-item priority selector
              if (item.prioritySelector) {
                const prioDiv = document.createElement('div');
                prioDiv.style.cssText = 'margin-top:6px;display:flex;align-items:center;gap:6px;';
                const prioLabel = document.createElement('span');
                prioLabel.style.cssText = 'font-size:0.82em;color:var(--vscode-descriptionForeground);';
                prioLabel.textContent = 'Priority:';
                prioDiv.appendChild(prioLabel);
                const prioSelect = document.createElement('select');
                prioSelect.style.cssText = 'background:var(--vscode-dropdown-background);color:var(--vscode-dropdown-foreground);border:1px solid var(--vscode-dropdown-border,#555);border-radius:4px;padding:2px 6px;font-family:inherit;font-size:0.82em;';
                ['medium', 'high', 'low'].forEach(val => {
                  const opt = document.createElement('option');
                  opt.value = val;
                  opt.textContent = val.charAt(0).toUpperCase() + val.slice(1);
                  prioSelect.appendChild(opt);
                });
                prioSelect.addEventListener('click', (e) => e.stopPropagation());
                prioSelect.addEventListener('change', () => {
                  if (!card._itemPriorities) card._itemPriorities = new Map();
                  card._itemPriorities.set(item.id, prioSelect.value);
                });
                prioDiv.appendChild(prioSelect);
                body.appendChild(prioDiv);
              }
              // Per-item comment input
              if (item.commentable) {
                const commentDiv = document.createElement('div');
                commentDiv.style.marginTop = '6px';
                const commentInput = document.createElement('textarea');
                commentInput.className = 'gate-item-comment';
                commentInput.placeholder = 'Leave a comment...';
                commentInput.style.cssText = 'width:100%;min-height:32px;max-height:80px;background:var(--vscode-input-background);color:var(--vscode-input-foreground);border:1px solid var(--vscode-input-border,#555);border-radius:4px;padding:4px 6px;font-family:inherit;font-size:0.85em;resize:vertical;';
                commentInput.addEventListener('click', (e) => e.stopPropagation());
                // Restore previous comment if available
                if (item.comment) {
                  commentInput.value = item.comment;
                  if (!card._itemComments) card._itemComments = new Map();
                  card._itemComments.set(item.id, item.comment);
                }
                commentInput.addEventListener('input', () => {
                  if (!card._itemComments) card._itemComments = new Map();
                  card._itemComments.set(item.id, commentInput.value);
                  updateApproveAllState(card);
                });
                commentDiv.appendChild(commentInput);
                body.appendChild(commentDiv);
              }

              itemEl.appendChild(body);
            }

            listDiv.appendChild(itemEl);
          });
          panel.appendChild(listDiv);

          // "Add Idea" button at bottom of items list (only for Ideas tabs, not Themes)
          if (tab.label === 'Ideas') {
            const addIdeaDiv = document.createElement('div');
            addIdeaDiv.style.cssText = 'margin-top:8px;';

            const addBtn = document.createElement('button');
            addBtn.className = 'gate-btn gate-btn-secondary';
            addBtn.style.cssText = 'font-size:0.82em;padding:3px 10px;';
            addBtn.textContent = '+ Add Idea';

            const addInput = document.createElement('div');
            addInput.style.cssText = 'display:none;margin-top:6px;';
            const addTextarea = document.createElement('textarea');
            addTextarea.style.cssText = 'width:100%;min-height:40px;max-height:80px;background:var(--vscode-input-background);color:var(--vscode-input-foreground);border:1px solid var(--vscode-input-border,#555);border-radius:4px;padding:4px 6px;font-family:inherit;font-size:0.85em;resize:vertical;';
            addTextarea.placeholder = 'Describe your idea...';
            addInput.appendChild(addTextarea);

            const addSubmit = document.createElement('button');
            addSubmit.className = 'gate-btn gate-btn-primary';
            addSubmit.style.cssText = 'font-size:0.82em;padding:3px 10px;margin-top:4px;';
            addSubmit.textContent = 'Add';
            addSubmit.addEventListener('click', () => {
              const text = addTextarea.value.trim();
              if (!text) return;
              if (!card._addedIdeas) card._addedIdeas = [];
              card._addedIdeas.push(text);

              // Render the new idea in the items list immediately
              const newId = Date.now() + card._addedIdeas.length;
              itemStates.set(newId, 'accepted');
              const itemEl = document.createElement('div');
              itemEl.className = 'gate-item user-added';
              itemEl.dataset.itemId = String(newId);
              const header = document.createElement('div');
              header.className = 'gate-item-header';
              const chevron = document.createElement('span');
              chevron.className = 'gate-item-chevron';
              chevron.textContent = '▶';
              header.appendChild(chevron);
              const titleSpan = document.createElement('span');
              titleSpan.className = 'gate-item-title';
              titleSpan.textContent = text;
              header.appendChild(titleSpan);
              const userTag = document.createElement('span');
              userTag.className = 'gate-item-verdict';
              userTag.style.cssText = 'background:rgba(76,175,125,0.15);color:var(--vscode-testing-iconPassed,#4caf7d);';
              userTag.textContent = 'user';
              header.appendChild(userTag);
              header.addEventListener('click', () => itemEl.classList.toggle('expanded'));
              itemEl.appendChild(header);
              listDiv.appendChild(itemEl);
              updateItemToggle(itemEl, 'accepted');

              addTextarea.value = '';
              listDiv.scrollTop = listDiv.scrollHeight;
            });
            addInput.appendChild(addSubmit);

            addBtn.addEventListener('click', () => {
              addInput.style.display = addInput.style.display === 'none' ? 'block' : 'none';
            });

            addIdeaDiv.appendChild(addBtn);
            addIdeaDiv.appendChild(addInput);
            panel.appendChild(addIdeaDiv);
          }
        }

        if (tab.saveOptions) {
          const saveDiv = document.createElement('div');
          saveDiv.className = 'gate-save-options';

          const formatsDiv = document.createElement('div');
          formatsDiv.className = 'gate-save-formats';
          let selectedFormat = tab.saveOptions.defaultFormat;
          tab.saveOptions.formats.forEach(fmt => {
            const label = document.createElement('label');
            label.className = 'gate-save-format';
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `save-format-${gate.gateId}`;
            radio.value = fmt;
            if (fmt === selectedFormat) radio.checked = true;
            radio.addEventListener('change', () => {
              selectedFormat = fmt;
              const ext = { markdown: '.md', html: '.html', pdf: '.pdf' }[fmt] || '.md';
              const pathInput = saveDiv.querySelector('.gate-save-path');
              if (pathInput) {
                pathInput.value = pathInput.value.replace(/\.[^.]+$/, ext);
              }
            });
            label.appendChild(radio);
            label.appendChild(document.createTextNode(fmt.charAt(0).toUpperCase() + fmt.slice(1)));
            formatsDiv.appendChild(label);
          });
          saveDiv.appendChild(formatsDiv);

          const pathLabel = document.createElement('div');
          pathLabel.textContent = 'Save to:';
          pathLabel.style.fontSize = '0.85em';
          pathLabel.style.marginBottom = '4px';
          pathLabel.style.color = 'var(--vscode-descriptionForeground)';
          saveDiv.appendChild(pathLabel);

          const pathInput = document.createElement('input');
          pathInput.type = 'text';
          pathInput.className = 'gate-save-path';
          pathInput.value = tab.saveOptions.defaultPath;
          saveDiv.appendChild(pathInput);

          panel.appendChild(saveDiv);

          // Store save options accessor on the card for gate resolution
          card._getSaveOptions = () => ({
            format: selectedFormat,
            path: pathInput.value,
          });
        }

        panels.push(panel);

        // Tab switching
        btn.addEventListener('click', () => {
          tabBar.querySelectorAll('.gate-tab').forEach(t => t.classList.remove('active'));
          panels.forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          panel.classList.add('active');
        });
      });

      card.appendChild(tabBar);
      panels.forEach(p => card.appendChild(p));

      // Store itemStates on card for gate resolution
      card._itemStates = itemStates;
    }

    function updateItemToggle(itemEl, status) {
      const toggles = itemEl.querySelectorAll('.gate-item-toggle');
      toggles[0]?.classList.toggle('selected-approve', status === 'approved');
      toggles[1]?.classList.toggle('selected-reject', status === 'rejected');
      // Disable "Approve All" if any items are rejected or commented
      const card = itemEl.closest('.gate-card');
      if (card) updateApproveAllState(card);
    }

    function updateApproveAllState(card) {
      const approveBtn = card.querySelector('[data-gate-action="approve"]');
      if (!approveBtn) return;
      const hasRejections = card._itemStates && [...card._itemStates.values()].some(s => s === 'rejected');
      const hasComments = card._itemComments && [...card._itemComments.values()].some(t => t.trim());
      if (hasRejections || hasComments) {
        approveBtn.disabled = true;
        approveBtn.title = 'Cannot approve all — items have rejections or comments. Use Converge or Diverge instead.';
      } else {
        approveBtn.disabled = false;
        approveBtn.title = '';
      }
    }

    function resolveGateCard(card, action, feedback) {
      // Send reply to extension → daemon resolves the gate
      const gateId = card.dataset.gateId;
      if (gateId) {
        vscode.postMessage({ type: 'gateReply', gateId, action, feedback });
      }

      card.classList.add('resolved');

      // Map action names to display labels and CSS classes
      const actionMap = {
        approve: { label: 'Approved', css: 'approved', icon: '✓' },
        reject: { label: 'Rejected', css: 'rejected', icon: '✗' },
        edit: { label: 'Edited', css: 'edited', icon: '✎' },
        execute: { label: 'Executed', css: 'executed', icon: '▶' },
        skip: { label: 'Skipped', css: 'rejected', icon: '⏭' },
        revise: { label: 'Revision requested', css: 'edited', icon: '✎' },
        select: { label: 'Selected', css: 'approved', icon: '✓' },
        reframe: { label: 'Reframed', css: 'edited', icon: '↻' },
        focus: { label: 'Focused', css: 'edited', icon: '◎' },
        converge: { label: 'Converging', css: 'approved', icon: '⇉' },
        continue: { label: 'Continuing', css: 'approved', icon: '→' },
        diverge: { label: 'Back to diverge', css: 'edited', icon: '⇇' },
      };

      const info = actionMap[action] || { label: action, css: 'approved', icon: '•' };

      const badge = document.createElement('div');
      badge.className = `gate-resolved-badge ${info.css}`;
      badge.textContent = `${info.icon} ${info.label}`;

      // Only show user-typed feedback, not structured JSON from collectGateData
      if (feedback && !feedback.startsWith('{')) {
        const fbText = document.createElement('span');
        fbText.style.opacity = '0.7';
        fbText.style.marginLeft = '8px';
        fbText.style.fontWeight = 'normal';
        fbText.textContent = `— "${feedback.slice(0, 80)}${feedback.length > 80 ? '...' : ''}"`;
        badge.appendChild(fbText);
      }

      card.appendChild(badge);
      scrollToBottom();
    }

    function createToolBlock(data) {
      const block = document.createElement('div');
      block.className = 'tool-block';
      const header = document.createElement('div');
      header.className = 'tool-header';
      header.innerHTML = `<span class="tool-chevron">▶</span><span class="tool-name">${data.name || 'tool'}</span><span class="tool-summary">${data.input || ''}</span>`;
      block.appendChild(header);
      const body = document.createElement('div');
      body.className = 'tool-body';
      body.textContent = data.output || '';
      block.appendChild(body);
      header.addEventListener('click', () => {
        const chev = header.querySelector('.tool-chevron');
        chev.classList.toggle('open');
        body.classList.toggle('open');
      });
      messagesEl.appendChild(block);
      scrollToBottom();
    }

    function createEscalationNotice(data) {
      const notice = document.createElement('div');
      notice.className = 'escalation-notice';
      notice.innerHTML = `
        <span>Escalating to</span>
        <span class="escalation-model">${data.model || 'Claude'}</span>
        ${data.tokens ? `<span class="escalation-tokens">~${data.tokens} tokens</span>` : ''}
      `;
      if (data.confirmRequired) {
        const btns = document.createElement('span');
        btns.className = 'escalation-confirm';
        btns.innerHTML = `<button class="confirm">Confirm</button><button>Cancel</button>`;
        btns.querySelector('.confirm').addEventListener('click', () => {
          vscode.postMessage({ type: 'gateReply', gateId: data.gateId, action: 'approve' });
          btns.remove();
          const badge = document.createElement('span');
          badge.className = 'gate-resolved-badge approved';
          badge.textContent = '✓ Confirmed';
          badge.style.marginLeft = 'auto';
          notice.appendChild(badge);
        });
        btns.querySelector('button:not(.confirm)').addEventListener('click', () => {
          vscode.postMessage({ type: 'gateReply', gateId: data.gateId, action: 'reject' });
          btns.remove();
          const badge = document.createElement('span');
          badge.className = 'gate-resolved-badge rejected';
          badge.textContent = '✗ Declined';
          badge.style.marginLeft = 'auto';
          notice.appendChild(badge);
        });
        notice.appendChild(btns);
      }
      messagesEl.appendChild(notice);
      scrollToBottom();
    }

    function createIntentBadge(intent) {
      const badge = document.createElement('span');
      badge.className = 'intent-badge';
      badge.textContent = intent;
      return badge;
    }

    inputEl.focus();
  </script>
</body>
</html>
