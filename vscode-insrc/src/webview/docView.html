<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--vscode-font-family, system-ui, sans-serif);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-editor-foreground);
      background: var(--vscode-editor-background);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--vscode-panel-border, #333);
      background: var(--vscode-sideBar-background, var(--vscode-editor-background));
      flex-shrink: 0;
    }
    .toolbar-title { font-weight: 600; font-size: 0.95em; }
    .toolbar-spacer { flex: 1; }
    .tool-btn {
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82em;
      border: 1px solid var(--vscode-panel-border, #555);
      background: transparent;
      color: var(--vscode-foreground);
    }
    .tool-btn:hover { background: rgba(255,255,255,0.05); }
    .tool-btn.active { background: var(--vscode-button-background); color: var(--vscode-button-foreground); border-color: transparent; }
    .format-toggle {
      display: flex;
      border: 1px solid var(--vscode-panel-border, #555);
      border-radius: 4px;
      overflow: hidden;
    }
    .format-btn {
      padding: 3px 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82em;
      border: none;
      background: transparent;
      color: var(--vscode-foreground);
    }
    .format-btn:hover { background: rgba(255,255,255,0.05); }
    .format-btn.active { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }

    /* Revision selector */
    .revision-select {
      background: var(--vscode-dropdown-background, var(--vscode-input-background));
      color: var(--vscode-dropdown-foreground, var(--vscode-input-foreground));
      border: 1px solid var(--vscode-dropdown-border, var(--vscode-input-border, #555));
      border-radius: 4px;
      padding: 2px 6px;
      font-family: inherit;
      font-size: 0.82em;
    }

    /* Split panes */
    .split-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .split-container.flipped { flex-direction: column-reverse; }

    .pane {
      flex: 1;
      overflow: auto;
      min-height: 80px;
    }

    .splitter {
      height: 4px;
      background: var(--vscode-panel-border, #333);
      cursor: row-resize;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splitter:hover { background: var(--vscode-focusBorder, #007acc); }
    .splitter-dot { width: 20px; height: 2px; background: var(--vscode-descriptionForeground, #888); border-radius: 1px; }

    /* Preview pane */
    .preview {
      padding: 16px 20px;
      line-height: 1.7;
    }
    .preview h1 { font-size: 1.6em; margin: 0.8em 0 0.4em; color: var(--vscode-foreground); }
    .preview h2 { font-size: 1.3em; margin: 1.2em 0 0.4em; color: var(--vscode-foreground); border-bottom: 1px solid var(--vscode-panel-border, #333); padding-bottom: 0.3em; }
    .preview h3 { font-size: 1.1em; margin: 1em 0 0.3em; }
    .preview p { margin: 0.5em 0; }
    .preview ul, .preview ol { padding-left: 1.5em; margin: 0.5em 0; }
    .preview li { margin: 0.2em 0; }
    .preview code {
      font-family: var(--vscode-editor-font-family, monospace);
      background: var(--vscode-textCodeBlock-background, rgba(0,0,0,0.2));
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 0.92em;
    }
    .preview pre {
      background: var(--vscode-textCodeBlock-background, rgba(0,0,0,0.2));
      padding: 10px 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0.8em 0;
      font-size: 0.88em;
      line-height: 1.5;
    }
    .preview pre code { background: none; padding: 0; }
    .preview table { width: 100%; border-collapse: collapse; margin: 0.8em 0; }
    .preview th, .preview td { border: 1px solid var(--vscode-panel-border, #333); padding: 6px 10px; text-align: left; }
    .preview th { background: var(--vscode-editorWidget-background, rgba(255,255,255,0.03)); font-weight: 600; }
    .preview blockquote { border-left: 3px solid var(--vscode-panel-border, #555); padding-left: 12px; color: var(--vscode-descriptionForeground); margin: 0.5em 0; }
    .preview a { color: var(--vscode-textLink-foreground, #3794ff); }

    /* Editor pane */
    .editor-pane {
      border-top: 1px solid var(--vscode-panel-border, #333);
    }
    .editor-pane textarea {
      width: 100%;
      height: 100%;
      background: var(--vscode-editor-background);
      color: var(--vscode-editor-foreground);
      border: none;
      padding: 12px 16px;
      font-family: var(--vscode-editor-font-family, 'Cascadia Code', monospace);
      font-size: var(--vscode-editor-font-size, 13px);
      line-height: 1.6;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 3px 12px;
      border-top: 1px solid var(--vscode-panel-border, #333);
      background: var(--vscode-sideBar-background, var(--vscode-editor-background));
      font-size: 0.78em;
      color: var(--vscode-descriptionForeground);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="toolbar-title" id="docTitle">Document</span>
    <span class="toolbar-spacer"></span>
    <select class="revision-select" id="revisionSelect" title="Revision history">
      <option value="current">Current</option>
    </select>
    <div class="format-toggle">
      <button class="format-btn active" id="fmtMd" onclick="setFormat('md')">MD</button>
      <button class="format-btn" id="fmtHtml" onclick="setFormat('html')">HTML</button>
    </div>
    <button class="tool-btn" id="swapBtn" title="Swap preview/editor positions">&#8645;</button>
    <button class="tool-btn" id="saveBtn" onclick="doSave()">Save</button>
  </div>

  <div class="split-container" id="splitContainer">
    <div class="pane preview" id="preview"></div>
    <div class="splitter"><div class="splitter-dot"></div></div>
    <div class="pane editor-pane">
      <textarea id="editor" spellcheck="false"></textarea>
    </div>
  </div>

  <div class="status-bar">
    <span id="formatLabel">Markdown</span>
    <span id="charCount">0 chars</span>
    <span id="lineCount">0 lines</span>
    <span class="toolbar-spacer"></span>
    <span id="saveStatus"></span>
  </div>

  <script>
    // @ts-ignore
    const vscode = acquireVsCodeApi();

    const preview = document.getElementById('preview');
    const editor = document.getElementById('editor');
    const splitContainer = document.getElementById('splitContainer');
    const revisionSelect = document.getElementById('revisionSelect');

    let format = 'md'; // 'md' or 'html'
    let revisions = []; // { name, content, format }
    let dirty = false;

    // Editor → preview live update
    editor.addEventListener('input', () => {
      renderPreview(editor.value);
      updateStatus();
      dirty = true;
    });

    // Swap button
    document.getElementById('swapBtn').addEventListener('click', () => {
      splitContainer.classList.toggle('flipped');
    });

    // Revision change
    revisionSelect.addEventListener('change', () => {
      const idx = parseInt(revisionSelect.value, 10);
      if (!isNaN(idx) && revisions[idx]) {
        const rev = revisions[idx];
        editor.value = rev.content;
        if (rev.format) setFormat(rev.format);
        renderPreview(rev.content);
        updateStatus();
      }
    });

    function setFormat(fmt) {
      format = fmt;
      document.getElementById('fmtMd').classList.toggle('active', fmt === 'md');
      document.getElementById('fmtHtml').classList.toggle('active', fmt === 'html');
      document.getElementById('formatLabel').textContent = fmt === 'md' ? 'Markdown' : 'HTML';
      renderPreview(editor.value);
    }

    function renderPreview(content) {
      if (format === 'html') {
        preview.innerHTML = content;
      } else {
        preview.innerHTML = renderMarkdown(content);
      }
    }

    function renderMarkdown(md) {
      // Simple markdown renderer
      return md
        // Code blocks
        .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
        // Headers
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        // Bold, italic
        .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        // Inline code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Links
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        // Blockquotes
        .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
        // Unordered lists
        .replace(/^[*-] (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
        // Ordered lists
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
        // Horizontal rule
        .replace(/^---$/gm, '<hr>')
        // Paragraphs (double newline)
        .replace(/\n\n/g, '</p><p>')
        .replace(/^/, '<p>')
        .replace(/$/, '</p>')
        // Single newline → br
        .replace(/\n/g, '<br>');
    }

    function updateStatus() {
      const text = editor.value;
      document.getElementById('charCount').textContent = `${text.length} chars`;
      document.getElementById('lineCount').textContent = `${text.split('\n').length} lines`;
    }

    function doSave() {
      vscode.postMessage({ type: 'save', content: editor.value, format });
    }

    // Messages from extension
    window.addEventListener('message', (event) => {
      const msg = event.data;
      switch (msg.type) {
        case 'setDocument':
          document.getElementById('docTitle').textContent = msg.title || 'Document';
          editor.value = msg.content || '';
          if (msg.format) setFormat(msg.format);
          renderPreview(msg.content || '');
          updateStatus();
          dirty = false;
          break;

        case 'appendContent':
          editor.value += msg.content;
          renderPreview(editor.value);
          updateStatus();
          break;

        case 'addRevision':
          revisions.push({ name: msg.name, content: msg.content, format: msg.format || format });
          const opt = document.createElement('option');
          opt.value = String(revisions.length - 1);
          opt.textContent = msg.name;
          revisionSelect.appendChild(opt);
          break;

        case 'saved':
          document.getElementById('saveStatus').textContent = 'Saved!';
          dirty = false;
          setTimeout(() => { document.getElementById('saveStatus').textContent = ''; }, 3000);
          break;
      }
    });

    updateStatus();
  </script>
</body>
</html>
