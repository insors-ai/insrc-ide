<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--vscode-font-family, system-ui, sans-serif);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-editor-foreground);
      background: var(--vscode-editor-background);
      padding: 16px;
      overflow-x: auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .header h1 { font-size: 1.3em; }
    .plan-title { flex: 1; color: var(--vscode-descriptionForeground); font-size: 0.9em; margin-left: 8px; }
    .toolbar { display: flex; gap: 6px; }
    .toolbar-btn {
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82em;
      border: 1px solid var(--vscode-panel-border, #555);
      background: transparent;
      color: var(--vscode-foreground);
    }
    .toolbar-btn:hover { background: rgba(255,255,255,0.05); }
    .toolbar-btn-primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); border: none; }
    .toolbar-btn-primary:hover { background: var(--vscode-button-hoverBackground); }
    .toolbar-btn:disabled { opacity: 0.5; cursor: default; }

    /* Progress bar */
    .progress-bar {
      height: 4px;
      background: var(--vscode-panel-border, #333);
      border-radius: 2px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--vscode-testing-iconPassed, #4caf7d);
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    /* Kanban board */
    .board {
      display: flex;
      gap: 12px;
      min-height: 300px;
    }
    .column {
      flex: 1;
      min-width: 160px;
      background: var(--vscode-editorWidget-background, rgba(255,255,255,0.02));
      border: 1px solid var(--vscode-panel-border, #333);
      border-radius: 6px;
      overflow: hidden;
    }
    .column-header {
      padding: 8px 10px;
      font-weight: 600;
      font-size: 0.85em;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--vscode-panel-border, #333);
    }
    .column-count {
      font-size: 0.78em;
      padding: 0 6px;
      border-radius: 10px;
      background: var(--vscode-badge-background);
      color: var(--vscode-badge-foreground);
    }
    .col-pending .column-header { color: var(--vscode-descriptionForeground); }
    .col-in-progress .column-header { color: var(--vscode-editorWarning-foreground, #cca700); }
    .col-done .column-header { color: var(--vscode-testing-iconPassed, #4caf7d); }
    .col-failed .column-header { color: var(--vscode-errorForeground, #f44); }
    .col-skipped .column-header { color: var(--vscode-descriptionForeground, #888); }

    .column-body {
      padding: 6px;
      min-height: 100px;
    }

    /* Step card */
    .step-card {
      background: var(--vscode-editor-background);
      border: 1px solid var(--vscode-panel-border, #333);
      border-radius: 5px;
      padding: 8px 10px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .step-card:hover { border-color: var(--vscode-focusBorder, #007acc); }
    .step-card.active {
      border-color: var(--vscode-editorWarning-foreground, #cca700);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { border-color: var(--vscode-editorWarning-foreground, #cca700); }
      50% { border-color: transparent; }
    }
    .step-title { font-weight: 500; font-size: 0.9em; margin-bottom: 3px; }
    .step-desc {
      font-size: 0.8em;
      color: var(--vscode-descriptionForeground);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .step-meta {
      display: flex;
      gap: 6px;
      margin-top: 5px;
      font-size: 0.72em;
    }
    .step-deps {
      color: var(--vscode-descriptionForeground);
      padding: 1px 5px;
      border-radius: 6px;
      background: var(--vscode-textCodeBlock-background, rgba(0,0,0,0.15));
    }
    .step-effort {
      color: var(--vscode-descriptionForeground);
    }

    /* Detail panel (shown when clicking a card) */
    .detail-panel {
      display: none;
      border: 1px solid var(--vscode-panel-border, #333);
      border-radius: 6px;
      padding: 14px;
      margin-top: 16px;
      background: var(--vscode-editorWidget-background, rgba(255,255,255,0.03));
    }
    .detail-panel.visible { display: block; }
    .detail-title { font-weight: 600; margin-bottom: 8px; }
    .detail-field { margin-bottom: 8px; }
    .detail-label { font-weight: 500; font-size: 0.88em; color: var(--vscode-descriptionForeground); margin-bottom: 2px; }
    .detail-value { font-size: 0.9em; }
    .detail-deps-list { padding-left: 16px; font-size: 0.88em; }
    .detail-deps-list li { margin-bottom: 2px; }

    .empty-state {
      color: var(--vscode-descriptionForeground);
      text-align: center;
      padding: 60px 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Plan</h1>
    <span class="plan-title" id="planTitle"></span>
    <div class="toolbar">
      <button class="toolbar-btn toolbar-btn-primary" id="startNextBtn" disabled>Start Next</button>
      <button class="toolbar-btn" id="skipStepBtn" disabled>Skip</button>
      <button class="toolbar-btn" id="viewFullBtn" disabled>View Full Plan</button>
    </div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="board" id="board">
    <div class="column col-pending" id="col-pending">
      <div class="column-header">Pending <span class="column-count" id="count-pending">0</span></div>
      <div class="column-body" id="body-pending"></div>
    </div>
    <div class="column col-in-progress" id="col-in-progress">
      <div class="column-header">In Progress <span class="column-count" id="count-in-progress">0</span></div>
      <div class="column-body" id="body-in-progress"></div>
    </div>
    <div class="column col-done" id="col-done">
      <div class="column-header">Done <span class="column-count" id="count-done">0</span></div>
      <div class="column-body" id="body-done"></div>
    </div>
    <div class="column col-failed" id="col-failed">
      <div class="column-header">Failed <span class="column-count" id="count-failed">0</span></div>
      <div class="column-body" id="body-failed"></div>
    </div>
    <div class="column col-skipped" id="col-skipped">
      <div class="column-header">Skipped <span class="column-count" id="count-skipped">0</span></div>
      <div class="column-body" id="body-skipped"></div>
    </div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="detail-title" id="detailTitle"></div>
    <div class="detail-field"><div class="detail-label">Description</div><div class="detail-value" id="detailDesc"></div></div>
    <div class="detail-field"><div class="detail-label">Dependencies</div><ul class="detail-deps-list" id="detailDeps"></ul></div>
    <div class="detail-field"><div class="detail-label">Effort</div><div class="detail-value" id="detailEffort"></div></div>
    <div class="detail-field"><div class="detail-label">Status</div><div class="detail-value" id="detailStatus"></div></div>
  </div>

  <div class="empty-state" id="emptyState">
    Run a <code>/plan</code> command in the chat panel to generate a plan.
  </div>

  <script>
    // @ts-ignore
    const vscode = acquireVsCodeApi();

    let steps = [];
    let activeStepId = null;

    document.getElementById('startNextBtn').addEventListener('click', () => {
      vscode.postMessage({ type: 'startNext' });
    });
    document.getElementById('skipStepBtn').addEventListener('click', () => {
      vscode.postMessage({ type: 'skipStep', stepId: activeStepId });
    });
    document.getElementById('viewFullBtn').addEventListener('click', () => {
      vscode.postMessage({ type: 'viewFullPlan' });
    });

    window.addEventListener('message', (event) => {
      const msg = event.data;
      switch (msg.type) {
        case 'setPlan':
          steps = msg.steps;
          activeStepId = msg.activeStepId || null;
          document.getElementById('planTitle').textContent = msg.title || '';
          document.getElementById('emptyState').style.display = 'none';
          document.getElementById('board').style.display = 'flex';
          renderBoard();
          break;
        case 'updateStep':
          updateStepStatus(msg.stepId, msg.status);
          break;
        case 'setActiveStep':
          activeStepId = msg.stepId;
          renderBoard();
          break;
      }
    });

    function renderBoard() {
      const columns = {
        'pending': [],
        'in-progress': [],
        'done': [],
        'failed': [],
        'skipped': [],
      };

      steps.forEach(step => {
        const status = step.status || 'pending';
        const col = status === 'in_progress' ? 'in-progress' : status;
        if (columns[col]) columns[col].push(step);
      });

      for (const [col, items] of Object.entries(columns)) {
        const body = document.getElementById(`body-${col}`);
        body.innerHTML = '';
        document.getElementById(`count-${col}`).textContent = String(items.length);

        items.forEach(step => {
          const card = document.createElement('div');
          card.className = `step-card${step.id === activeStepId ? ' active' : ''}`;
          card.onclick = () => showDetail(step);
          card.innerHTML = `
            <div class="step-title">${step.title || step.id}</div>
            <div class="step-desc">${step.description || ''}</div>
            <div class="step-meta">
              ${step.dependencies?.length ? `<span class="step-deps">${step.dependencies.length} deps</span>` : ''}
              ${step.effort ? `<span class="step-effort">${step.effort}</span>` : ''}
            </div>
          `;
          body.appendChild(card);
        });
      }

      // Update progress bar
      const done = columns['done'].length + columns['skipped'].length;
      const total = steps.length || 1;
      document.getElementById('progressFill').style.width = `${Math.round(done / total * 100)}%`;

      // Enable/disable toolbar buttons
      const hasActive = activeStepId !== null;
      const hasPending = columns['pending'].length > 0;
      document.getElementById('startNextBtn').disabled = !hasPending || hasActive;
      document.getElementById('skipStepBtn').disabled = !hasActive;
      document.getElementById('viewFullBtn').disabled = steps.length === 0;
    }

    function updateStepStatus(stepId, status) {
      const step = steps.find(s => s.id === stepId);
      if (step) {
        step.status = status;
        if (status === 'done' || status === 'failed' || status === 'skipped') {
          if (activeStepId === stepId) activeStepId = null;
        }
        renderBoard();
      }
    }

    function showDetail(step) {
      const panel = document.getElementById('detailPanel');
      document.getElementById('detailTitle').textContent = step.title || step.id;
      document.getElementById('detailDesc').textContent = step.description || '—';
      document.getElementById('detailEffort').textContent = step.effort || '—';
      document.getElementById('detailStatus').textContent = step.status || 'pending';

      const deps = document.getElementById('detailDeps');
      deps.innerHTML = '';
      if (step.dependencies?.length) {
        step.dependencies.forEach(d => {
          const li = document.createElement('li');
          li.textContent = d;
          deps.appendChild(li);
        });
      } else {
        deps.innerHTML = '<li style="color:var(--vscode-descriptionForeground)">None</li>';
      }

      panel.classList.add('visible');
    }

    // Initial state
    document.getElementById('board').style.display = 'none';
  </script>
</body>
</html>
