# Live-DB fixtures for the data-driver integration tests
# (plans/data-driver.md phase 1 testing).
#
# Bring everything up:
#   docker compose -f test/fixtures/db-driver/docker-compose.yml up -d
#
# Run the suite:
#   INSRC_DB_TESTS=1 \
#   INSRC_TEST_PG_URL=postgres://insrc:insrc@localhost:5544/insrc_test \
#   INSRC_TEST_MYSQL_URL=mysql://insrc:insrc@localhost:3344/insrc_test \
#   INSRC_TEST_REDIS_URL=redis://localhost:6344 \
#   INSRC_TEST_MONGO_URL=mongodb://insrc:insrc@localhost:27044/insrc_test \
#   npm run test:data-driver --prefix src/insrc
#
# Tear down:
#   docker compose -f test/fixtures/db-driver/docker-compose.yml down -v
#
# All ports are off-default so the fixtures coexist with any local
# DB instances the user already has open. Volumes are anonymous so
# `down -v` is the canonical reset.

services:
  postgres:
    image: postgres:16-alpine
    container_name: insrc-test-postgres
    environment:
      POSTGRES_USER: insrc
      POSTGRES_PASSWORD: insrc
      POSTGRES_DB: insrc_test
    ports:
      - "5544:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insrc -d insrc_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8
    container_name: insrc-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: insrc
      MYSQL_USER: insrc
      MYSQL_PASSWORD: insrc
      MYSQL_DATABASE: insrc_test
    ports:
      - "3344:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uinsrc", "-pinsrc"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: insrc-test-redis
    ports:
      - "6344:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongodb:
    image: mongo:7
    container_name: insrc-test-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: insrc
      MONGO_INITDB_ROOT_PASSWORD: insrc
      MONGO_INITDB_DATABASE: insrc_test
    ports:
      - "27044:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 3s
      timeout: 5s
      retries: 30
